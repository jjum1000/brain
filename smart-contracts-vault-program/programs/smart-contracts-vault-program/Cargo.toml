[package]
name = "smart-contracts-vault-program"
version.workspace = true
edition.workspace = true
description = "Vault program for Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "smart_contracts_vault_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
